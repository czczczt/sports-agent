name: Stage 0
on:
  push:
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: stage0
          POSTGRES_PASSWORD: stage0-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stage0 -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://stage0:stage0-ci-only@127.0.0.1:5432/postgres
      TEST_POSTGRES_ADMIN_URL: postgresql://stage0:stage0-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic heads
      - run: python -m pytest tests/stage0 tests/test_auth.py tests/test_athlete_fields.py tests/test_privacy_and_roles.py tests/test_requests_and_reports.py tests/test_distance_scoring.py tests/test_scoring.py tests/test_multi_sport_calculator.py tests/test_backup.py tests/test_rating_recalculation.py tests/test_init_athletes.py tests/test_procrastinate_worker.py tests/test_recipe_agent.py tests/test_status_api.py tests/test_russia_running_pilot.py tests/test_russia_running_pipeline.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sports-agent:ci .
