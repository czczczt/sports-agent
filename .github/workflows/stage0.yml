name: Stage 0
on:
  push:
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: stage0
          POSTGRES_PASSWORD: stage0-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stage0 -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://stage0:stage0-ci-only@127.0.0.1:5432/postgres
      TEST_POSTGRES_ADMIN_URL: postgresql://stage0:stage0-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: python -m ruff check app tests scripts
      - name: Check OpenAPI Contract Drift
        run: python scripts/generate_types.py --check
      - name: Verify Alembic Migrations and Roundtrip
        run: |
          python -m alembic heads
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Run Pytest Suite
        run: python -m pytest tests/stage0 tests/test_auth.py tests/test_athlete_fields.py tests/test_privacy_and_roles.py tests/test_requests_and_reports.py tests/test_verify_queue.py tests/test_admin_athletes.py tests/test_captain_moderation.py tests/test_distance_scoring.py tests/test_scoring.py tests/test_multi_sport_calculator.py tests/test_golden_scoring.py tests/test_openapi_drift.py tests/test_backup.py tests/test_rating_recalculation.py tests/test_rating_multisport_and_asof.py tests/test_calendar_and_series.py tests/test_block9_formula_and_ui.py tests/test_init_athletes.py tests/test_procrastinate_worker.py tests/test_recipe_agent.py tests/test_status_api.py tests/test_russia_running_pilot.py tests/test_russia_running_pipeline.py tests/test_collection_sources.py tests/test_probeg_adapter.py tests/test_grom_myrunstats_pipeline.py tests/test_ironstar_russialoppet.py tests/test_wave2_collection.py tests/test_wave2_html.py tests/test_wave2_myfinish_orgeo.py tests/test_wave2_trail_tri.py tests/test_bulk_collection.py tests/test_bulk_retention.py tests/test_bulk_approval_publication.py -q


  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify API TypeScript types generation
        run: npm run gen:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/shared/api/schema.d.ts
      - run: npm run lint && npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sports-agent:ci .
