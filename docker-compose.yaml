x-app: &app
  image: ${COMPOSE_PROJECT_NAME:-sports-agent}-app:local
  build: .
  environment:
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sports_agent}}
    APP_HOST: 0.0.0.0
    APP_PORT: 8000
    GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
    GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
    GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
    GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-true}
    AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env}

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sports_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *app
    build: .
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  worker-browser:
    image: mcr.microsoft.com/playwright/python:v1.49.0-noble
    command: ["python", "-c", "import time; print('Playwright browser worker ready'); time.sleep(315360000)"]
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging

volumes:
  pgdata:
