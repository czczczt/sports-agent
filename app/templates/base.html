<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Платформа бегового рейтинга (MVP){% endblock %}</title>
    <!-- Tailwind CSS CDN для быстрого чернового UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN для графиков динамики и распределения -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <!-- Навигация -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🏃</span>
                <div>
                    <a href="/" class="font-bold text-xl tracking-tight hover:text-emerald-100">СберСпорт // Бег</a>
                    <span class="ml-2 text-xs bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded-full uppercase tracking-wider font-semibold">MVP</span>
                </div>
            </div>
            <nav class="flex items-center space-x-6 text-sm font-medium">
                <a href="/" class="hover:text-emerald-200 transition">Поиск спортсмена</a>
                <a href="/events-view" class="hover:text-emerald-200 transition">Каталог стартов</a>
                <a href="/docs" target="_blank" class="bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded-md transition text-xs font-mono">Swagger API</a>
            </nav>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-12">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-2">
            <div>Платформа рейтинга спортсменов (FastAPI MVP) • Беговой прототип</div>
            <div>Оценка ИИ-агента носит исключительно справочный характер.</div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
